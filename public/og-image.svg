<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120" />
      <stop offset="1" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1060" cy="80" r="230" fill="#6366f1" opacity="0.18" />
  <circle cx="110" cy="590" r="190" fill="#22d3ee" opacity="0.12" />

  <!-- Logo and wordmark -->
  <g transform="translate(80, 68)">
    <rect width="52" height="52" rx="13" fill="#4f46e5" />
    <rect
      x="10"
      y="13"
      width="32"
      height="21"
      rx="3"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.8"
    />
    <path
      d="M20 40h12M26 34v6"
      stroke="#ffffff"
      stroke-width="2.8"
      stroke-linecap="round"
    />
    <text
      x="70"
      y="36"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="32"
      font-weight="700"
      fill="#ffffff"
    >
      Screen<tspan fill="#818cf8">Check</tspan>
    </text>
  </g>

  <!-- Big result -->
  <text
    x="80"
    y="300"
    font-family="Consolas, Menlo, monospace"
    font-size="108"
    font-weight="700"
    fill="#ffffff"
  >
    1920 × 1080
  </text>

  <rect x="80" y="330" width="156" height="48" rx="24" fill="url(#accent)" />
  <text
    x="158"
    y="363"
    text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="24"
    font-weight="700"
    fill="#0b1120"
  >
    1080p
  </text>

  <!-- Tagline -->
  <text
    x="80"
    y="452"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="34"
    font-weight="600"
    fill="#c7d2fe"
  >
    Know your screen resolution —
  </text>
  <text
    x="80"
    y="502"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="34"
    font-weight="600"
    fill="#c7d2fe"
  >
    and whether it is set correctly.
  </text>

  <!-- Footer -->
  <text
    x="80"
    y="572"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="22"
    fill="#94a3b8"
  >
    Free · No signup · Runs in your browser
  </text>
</svg>
